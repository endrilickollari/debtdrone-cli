<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">DebtDrone MCP agent flow</title>
  <desc id="desc">A local coding agent starts DebtDrone over standard input and output. DebtDrone exposes the scan repository tool and restricts scanner access to the configured repository root.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#f7f6f8" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c5f542"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="438" rx="16" fill="#0c0b0e" stroke="#302f34"/>
  <rect x="1" y="1" width="958" height="438" rx="16" fill="url(#grid)"/>
  <text x="48" y="48" fill="#c5f542" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2">AGENTS / LOCAL MCP FLOW</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g transform="translate(48 106)">
      <rect width="174" height="94" rx="9" fill="#111013" stroke="#35343a"/>
      <text x="18" y="29" fill="#99969f" font-size="10" letter-spacing="1.4">MCP CLIENT</text>
      <text x="18" y="58" fill="#f7f6f8" font-size="15" font-weight="700">coding agent</text>
      <text x="18" y="78" fill="#99969f" font-size="10">Codex · Claude Code</text>
    </g>

    <g transform="translate(284 88)">
      <rect width="310" height="130" rx="9" fill="#171619" stroke="#c5f542" stroke-opacity="0.65"/>
      <circle cx="22" cy="22" r="4" fill="#e95d5d"/>
      <circle cx="38" cy="22" r="4" fill="#d6bd4c"/>
      <circle cx="54" cy="22" r="4" fill="#c5f542"/>
      <text x="22" y="61" fill="#c5f542" font-size="11">$ debtdrone mcp \</text>
      <text x="38" y="84" fill="#f7f6f8" font-size="11">--root /absolute/path</text>
      <text x="22" y="111" fill="#99969f" font-size="10">local · stdio · read-only</text>
    </g>

    <g transform="translate(656 106)">
      <rect width="256" height="94" rx="9" fill="#c5f542" fill-opacity="0.1" stroke="#c5f542" stroke-opacity="0.45"/>
      <text x="18" y="29" fill="#c5f542" font-size="10" letter-spacing="1.4">SCANNER</text>
      <text x="18" y="58" fill="#f7f6f8" font-size="15" font-weight="700">scanner.Scan</text>
      <text x="18" y="78" fill="#99969f" font-size="10">neutral report contract</text>
    </g>

    <text x="253" y="139" fill="#99969f" font-size="9" text-anchor="middle">STDIO</text>
    <text x="625" y="139" fill="#99969f" font-size="9" text-anchor="middle">CALL</text>

    <line x1="48" y1="270" x2="912" y2="270" stroke="#35343a"/>
    <text x="48" y="306" fill="#99969f" font-size="10" letter-spacing="1.4">ENFORCED REPOSITORY BOUNDARY</text>

    <g transform="translate(48 330)">
      <rect width="410" height="64" rx="8" fill="#111013" stroke="#35343a"/>
      <text x="18" y="25" fill="#99969f" font-size="10" font-weight="700">CONFIGURED ROOT</text>
      <text x="18" y="47" fill="#f7f6f8" font-size="11">/absolute/path/to/repository</text>
    </g>

    <g transform="translate(502 330)">
      <rect width="410" height="64" rx="8" fill="#c5f542" fill-opacity="0.1" stroke="#c5f542" stroke-opacity="0.45"/>
      <text x="18" y="25" fill="#c5f542" font-size="10" font-weight="700">TOOL RESULT</text>
      <text x="18" y="47" fill="#f7f6f8" font-size="11">scan_repository · schema v1</text>
    </g>
  </g>

  <g fill="none" stroke="#c5f542" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M222 153 H276"/>
    <path d="M594 153 H648"/>
    <path d="M784 200 V310 H707 V322"/>
  </g>
</svg>
