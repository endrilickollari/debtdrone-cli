<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">DebtDrone CLI and SaaS ownership boundary</title>
  <desc id="desc">The open-source repository owns the scanner and local interfaces. The SaaS imports a pinned scanner version and owns hosted orchestration, storage, billing, and integrations.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#f7f6f8" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c5f542"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="498" rx="16" fill="#0c0b0e" stroke="#302f34"/>
  <rect x="1" y="1" width="958" height="498" rx="16" fill="url(#grid)"/>
  <text x="48" y="48" fill="#c5f542" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2">OWNERSHIP / DEPENDENCIES MOVE RIGHT</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="48" y="76" width="522" height="356" rx="12" fill="#111013" stroke="#35343a"/>
    <text x="72" y="108" fill="#99969f" font-size="10" letter-spacing="1.5">OPEN SOURCE · debtdrone-cli</text>

    <rect x="78" y="142" width="130" height="62" rx="8" fill="#171619" stroke="#35343a"/>
    <text x="143" y="169" fill="#f7f6f8" font-size="13" font-weight="700" text-anchor="middle">CLI</text>
    <text x="143" y="188" fill="#99969f" font-size="10" text-anchor="middle">headless output</text>

    <rect x="78" y="228" width="130" height="62" rx="8" fill="#171619" stroke="#35343a"/>
    <text x="143" y="255" fill="#f7f6f8" font-size="13" font-weight="700" text-anchor="middle">TUI</text>
    <text x="143" y="274" fill="#99969f" font-size="10" text-anchor="middle">local explorer</text>

    <rect x="78" y="314" width="130" height="62" rx="8" fill="#171619" stroke="#35343a" stroke-dasharray="5 5"/>
    <text x="143" y="341" fill="#99969f" font-size="13" font-weight="700" text-anchor="middle">MCP</text>
    <text x="143" y="360" fill="#6b6870" font-size="10" text-anchor="middle">planned adapter</text>

    <rect x="276" y="142" width="260" height="234" rx="10" fill="#171619" stroke="#c5f542" stroke-opacity="0.65"/>
    <rect x="294" y="160" width="116" height="22" rx="4" fill="#c5f542"/>
    <text x="352" y="175" fill="#13210c" font-size="10" font-weight="800" text-anchor="middle">PUBLIC BOUNDARY</text>
    <text x="302" y="219" fill="#f7f6f8" font-size="17" font-weight="700">scanner/*</text>
    <text x="302" y="247" fill="#99969f" font-size="11">options · progress · reports</text>
    <line x1="302" y1="269" x2="510" y2="269" stroke="#35343a"/>
    <text x="302" y="297" fill="#f7f6f8" font-size="12">complexity · security</text>
    <text x="302" y="320" fill="#f7f6f8" font-size="12">coverage · structure</text>
    <text x="302" y="350" fill="#99969f" font-size="10">neutral · deterministic · tested</text>

    <rect x="620" y="76" width="292" height="356" rx="12" fill="#111013" stroke="#35343a"/>
    <text x="644" y="108" fill="#99969f" font-size="10" letter-spacing="1.5">HOSTED PRODUCT · debtdrone</text>
    <rect x="650" y="142" width="232" height="62" rx="8" fill="#171619" stroke="#c5f542" stroke-opacity="0.4"/>
    <text x="670" y="169" fill="#f7f6f8" font-size="13" font-weight="700">SaaS adapter</text>
    <text x="670" y="188" fill="#99969f" font-size="10">pinned v2 module version</text>

    <rect x="650" y="228" width="232" height="148" rx="8" fill="#171619" stroke="#35343a"/>
    <text x="670" y="257" fill="#f7f6f8" font-size="12" font-weight="700">Hosted concerns</text>
    <text x="670" y="284" fill="#99969f" font-size="11">workers · queues · isolation</text>
    <text x="670" y="307" fill="#99969f" font-size="11">database · organizations</text>
    <text x="670" y="330" fill="#99969f" font-size="11">billing · notifications</text>
    <text x="670" y="353" fill="#99969f" font-size="11">GitHub · Jira · Trello · AI</text>
  </g>

  <g fill="none" stroke="#c5f542" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M208 173 H268"/>
    <path d="M208 259 H268"/>
    <path d="M536 173 H642"/>
  </g>
  <path d="M208 345 H268" fill="none" stroke="#6b6870" stroke-width="1.5" stroke-dasharray="5 5"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <line x1="48" y1="460" x2="912" y2="460" stroke="#35343a"/>
    <text x="48" y="482" fill="#6b6870" font-size="10">SCANNER NEVER IMPORTS DATABASE, BILLING, QUEUE, OR INTEGRATION TYPES</text>
    <text x="912" y="482" fill="#c5f542" font-size="10" text-anchor="end">VERSIONED MODULE →</text>
  </g>
</svg>
