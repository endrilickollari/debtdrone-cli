name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run Unit Tests
        run: go test -v -cover ./...

      - name: Build the Binary
        run: go build -o debtdrone ./cmd/debtdrone

      - name: Run DebtDrone Quality Gate
        # Dogfooding: we run the freshly compiled binary against our own codebase.
        # We allow this step to fail (continue-on-error) so we can see the debt 
        # report for information without blocking the CI pipeline.
        run: ./debtdrone scan ./ --format=text --fail-on=high
        continue-on-error: true

  mcp-protocol:
    name: Local State and MCP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run cross-platform local state tests
        run: go test -v ./internal/localconfig ./internal/localhistory ./internal/mcpserver

      - name: Run config and MCP command integration tests
        run: go test -v ./cmd/debtdrone -run '^(TestConfig|TestMCP)'
